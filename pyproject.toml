[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscrap"
version = "0.5.0a1"
description = "Autonomous Direct Company Career & ATS Job Scraper Library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "bytebldr" }
]
dependencies = [
    "curl_cffi>=0.7.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
jobscrap = "jobscrap.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jobscrap*"]
